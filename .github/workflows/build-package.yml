name: Build & Release Theme Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: |
          npm run lint
          npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Build and Package Theme
        run: |
          npm run package
          npm run package:zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sao-theme-package
          path: |
            theme.tar.gz
            *.tar.gz
            *.zip
            preview.png
            theme.json

      - name: Resolve Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release-notes
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "path=.github/default-release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "SAO Theme ${{ github.ref_name }}"
          files: |
            theme.tar.gz
            *.tar.gz
            *.zip
            preview.png
            theme.json
          body_path: ${{ steps.release-notes.outputs.path }}
          draft: false
          prerelease: false
